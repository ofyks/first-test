plugins {
    id 'java'
    id 'io.qameta.allure' version "4.0.2"
    id 'io.freefair.lombok' version '9.5.0'
}

def allureVersion = "2.32.0"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "io.qameta.allure:allure-junit5:$allureVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'com.codeborne:selenide:7.15.0'
    testImplementation 'net.datafaker:datafaker:2.5.4'
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
}